           regardless of exact header/footer height on any screen. */
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; overflow: hidden; }
        #main-header { position: relative; box-shadow: none; }
        main { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; }

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }
        .home-logo {
            width: auto;
            height: auto;
            max-width: min(420px, 55vw);
            max-height: 38vh;
        }
        footer { padding: 1.75rem 0; flex-shrink: 0; }
        @media (max-height: 700px) {
            .home-logo { max-height: 30vh; }
            .home-tagline { font-size: 1.4rem; }
            footer { padding: 1rem 0; }
            .footer-contact, footer p { font-size: 0.85rem; }
        }
    </style>
